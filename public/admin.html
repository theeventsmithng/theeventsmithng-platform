<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The EventSmith NG: Admin Prototype</title>
</head>
<body style="margin:0;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');

.tes-app {
  --bg: #F4EBDD;
  --surface: #FAF6F0;
  --surface-alt: #F4EBDD;
  --ink: #2B1C18;
  --ink-soft: #4A3028;
  --ink-muted: #9A7B68;
  --brand: #4A3028;
  --brand-2: #2B1C18;
  --taupe: #9A7B68;
  --line: #D8C7B5;
  --line-soft: #E9DFD3;
  --positive: #5F7052;
  --positive-bg: #EDF0E5;
  --warning: #A56A3E;
  --warning-bg: #F6EADB;
  --danger: #9B4A3B;
  --danger-bg: #F5E4DE;
  --info: #6C6250;

  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  color: var(--ink);
  background: var(--bg);
  display: flex;
  min-height: 100vh;
  width: 100%;
  font-size: 15.5px;
  line-height: 1.4;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
}
.tes-app.tes-app--full { display: block; }
.tes-app * { box-sizing: border-box; }
.tes-app h1, .tes-app h2, .tes-app h3, .tes-app .serif {
  font-family: 'Cormorant', serif; font-style: italic;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--brand);
}
.tes-app button { font-family: inherit; cursor: pointer; }
.tes-app a { color: inherit; text-decoration: none; }

/* ---------- SIDEBAR ---------- */
.tes-sidebar {
  width: 232px;
  flex-shrink: 0;
  background: var(--brand);
  color: #EFE7D9;
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
}
.tes-logo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 22px 8px;
  border-bottom: 1px solid rgba(239,231,217,0.14);
  margin-bottom: 18px;
}
.tes-logo-mark {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #EFE7D9;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.tes-logo-mark img { width: 78%; height: 78%; object-fit: contain; }
.tes-logo-text { font-family: 'Cormorant', serif; font-style: italic; font-size: 15.5px; line-height: 1.15; color: #F7F1E4; }
.tes-logo-text small { display: block; font-family: 'Cormorant Garamond', serif; font-size: 10.5px; color: #C9B79C; letter-spacing: 0.02em; margin-top: 2px; }

.tes-nav { display: flex; flex-direction: column; gap: 2px; }
.tes-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  color: #D9CBB4;
  background: transparent;
  border: none;
  font-size: 13.5px;
  text-align: left;
  width: 100%;
  transition: background 0.12s ease, color 0.12s ease;
}
.tes-nav-item:hover { background: rgba(239,231,217,0.08); color: #F7F1E4; }
.tes-nav-item.active { background: rgba(239,231,217,0.14); color: #F7F1E4; font-weight: 600; }
.tes-nav-icon { width: 17px; text-align: center; opacity: 0.9; font-size: 14px; }

.tes-sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid rgba(239,231,217,0.14);
  font-size: 12px;
  color: #B8A78C;
  display: flex; align-items: center; gap: 8px;
}
.tes-avatar-sm {
  width: 26px; height: 26px; border-radius: 50%;
  background: #6B4A2E; color: #F0E7D6;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
}

/* ---------- MAIN ---------- */
.tes-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tes-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 32px 0 32px;
}
.tes-page-title { font-size: 25px; margin: 0; }
.tes-page-sub { color: var(--ink-muted); font-size: 13px; margin-top: 3px; }
.tes-content { padding: 18px 32px 40px 32px; overflow-y: auto; }

.tes-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px;
  border-radius: 7px;
  border: 1px solid transparent;
  font-size: 13px; font-weight: 600;
  background: var(--brand);
  color: #F7F1E4;
}
.tes-btn:hover { background: var(--brand-2); }
.tes-btn.secondary {
  background: transparent; color: var(--brand); border: 1px solid var(--line);
}
.tes-btn.secondary:hover { background: var(--surface-alt); }
.tes-btn.small { padding: 6px 12px; font-size: 12px; }

/* ---------- KPI TILES ---------- */
.tes-kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 18px 0 26px 0; }
.tes-kpi {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px;
  padding: 14px 16px;
}
.tes-kpi-label { font-size: 11.5px; color: var(--ink-muted); font-weight: 500; }
.tes-kpi-value { font-family: 'Cormorant', serif; font-style: italic; font-size: 21px; color: var(--brand); margin-top: 5px; }
.tes-kpi-value.warn { color: var(--warning); }
.tes-kpi-value.danger { color: var(--danger); }

/* ---------- FILTER BAR ---------- */
.tes-filterbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.tes-chip {
  padding: 6px 13px; border-radius: 20px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
}
.tes-chip.active { background: var(--brand); color: #F7F1E4; border-color: var(--brand); }

/* ---------- EVENT CARDS ---------- */
.tes-events-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.tes-event-card {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px;
  padding: 18px 20px; cursor: pointer; transition: border-color 0.12s ease, transform 0.12s ease;
}
.tes-event-card:hover { border-color: var(--taupe); }
.tes-event-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.tes-event-name { font-family: 'Cormorant', serif; font-style: italic; font-size: 17px; color: var(--ink); }
.tes-event-type { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.tes-stage-pill {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  background: var(--positive-bg); color: var(--positive); white-space: nowrap;
}
.tes-stage-pill.warn { background: var(--warning-bg); color: var(--warning); }
.tes-event-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 12.5px; color: var(--ink-soft); }
.tes-event-meta b { color: var(--ink); font-weight: 600; }
.tes-progress-track { height: 6px; background: var(--line-soft); border-radius: 4px; margin-top: 14px; overflow: hidden; }
.tes-progress-fill { height: 100%; background: var(--brand-2); border-radius: 4px; }
.tes-progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); margin-top: 5px; }

/* ---------- TWO COLUMN DASH ---------- */
.tes-dash-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-top: 24px; align-items: start;}
.tes-panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 18px 20px; }
.tes-panel-title { font-size: 13.5px; font-weight: 600; color: var(--brand); margin-bottom: 12px; }
.tes-task-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.tes-task-row:last-child { border-bottom: none; }
.tes-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.tes-dot.high { background: var(--danger); }
.tes-dot.med { background: var(--warning); }
.tes-dot.low { background: var(--info); }
.tes-task-meta { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; }

/* ---------- EVENT WORKSPACE ---------- */
.tes-breadcrumb { font-size: 12.5px; color: var(--ink-muted); margin-bottom: 6px; }
.tes-breadcrumb span { cursor: pointer; }
.tes-breadcrumb span:hover { color: var(--brand); text-decoration: underline; }
.tes-workspace-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;}
.tes-workspace-title-row { display: flex; align-items: baseline; gap: 12px; }
.tes-countdown { font-size: 12.5px; color: var(--warning); font-weight: 600; background: var(--warning-bg); padding: 4px 10px; border-radius: 20px; }

.tes-tabbar { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 18px 0 22px 0; overflow-x: auto; }
.tes-tab {
  padding: 10px 15px; font-size: 13px; font-weight: 500; color: var(--ink-muted);
  border-bottom: 2px solid transparent; background: none; white-space: nowrap;
}
.tes-tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
.tes-tab:hover:not(.active) { color: var(--ink-soft); }

.tes-overview-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.tes-fact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 22px; margin-top: 4px; }
.tes-fact-label { font-size: 11px; color: var(--ink-muted); text-transform: none; }
.tes-fact-value { font-size: 13.5px; color: var(--ink); margin-top: 3px; font-weight: 500; }

.tes-component-tabs { display: flex; gap: 8px; margin: 16px 0; }
.tes-component-tab {
  padding: 7px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
}
.tes-component-tab.active { background: var(--brand); color: #F7F1E4; border-color: var(--brand); }

.tes-email-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.tes-email-row:last-child { border-bottom: none; }
.tes-email-row .tes-remove { color: var(--danger); font-size: 12px; font-weight: 600; background: none; border: none; }

/* ---------- BUDGET ---------- */
.tes-budget-summary { display: flex; gap: 12px; margin-bottom: 18px; }
.tes-budget-summary .tes-kpi { flex: 1; }
.tes-category { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.tes-category-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 18px; background: var(--surface-alt); cursor: pointer;
}
.tes-category-head-left { display: flex; align-items: center; gap: 10px; }
.tes-caret { font-size: 11px; color: var(--ink-muted); transition: transform 0.15s ease; display: inline-block; }
.tes-caret.open { transform: rotate(90deg); }
.tes-category-name { font-weight: 600; font-size: 13.5px; color: var(--ink); }
.tes-category-total { font-family: 'Cormorant', serif; font-style: italic; font-size: 15px; color: var(--brand); }
.tes-category-body { padding: 4px 18px 12px 18px; display: none; }
.tes-category-body.open { display: block; }

.tes-lineitem { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.tes-lineitem:last-child { border-bottom: none; }
.tes-lineitem-row { display: flex; align-items: center; gap: 10px; }
.tes-lineitem-name { font-size: 13.5px; font-weight: 500; flex: 1; }
.tes-mode-badge {
  font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  background: var(--line-soft); color: var(--ink-soft); cursor: pointer;
}
.tes-mode-badge.competing { background: #EDE3F0; color: #6B4E7A; }
.tes-mode-badge.split { background: #DCE6EA; color: #3F6A78; }
.tes-lineitem-amount { font-size: 13.5px; font-weight: 600; color: var(--ink); width: 130px; text-align: right; }
.tes-lineitem-balance { font-size: 11.5px; color: var(--ink-muted); width: 130px; text-align: right; }
.tes-lineitem-detail { display: none; margin-top: 10px; padding: 12px 14px; background: var(--surface-alt); border-radius: 8px; }
.tes-lineitem-detail.open { display: block; }

.tes-vendor-option-row, .tes-vendor-alloc-row {
  display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line);
}
.tes-vendor-option-row:last-child, .tes-vendor-alloc-row:last-child { border-bottom: none; }
.tes-vo-name { font-weight: 600; font-size: 12.5px; flex: 1; }
.tes-vo-includes { font-size: 11.5px; color: var(--ink-muted); flex: 1.4; }
.tes-vo-amount { font-size: 12.5px; font-weight: 600; width: 110px; text-align: right; }
.tes-status-tag { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; width: 92px; text-align: center; }
.tes-status-tag.selected { background: var(--positive-bg); color: var(--positive); }
.tes-status-tag.rejected { background: var(--line-soft); color: var(--ink-muted); text-decoration: line-through; }
.tes-status-tag.considering { background: var(--warning-bg); color: var(--warning); }
.tes-select-btn { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--brand); background: none; color: var(--brand); }
.tes-select-btn:hover { background: var(--brand); color: #F7F1E4; }

.tes-alloc-portion { font-size: 11.5px; color: var(--ink-muted); width: 100px; }
.tes-alloc-sum { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-muted); display: flex; justify-content: space-between; }

.tes-grandtotal-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--brand); color: #F7F1E4; border-radius: 10px; padding: 16px 22px; margin-top: 6px;
}
.tes-grandtotal-bar .tes-gt-label { font-size: 12.5px; color: #D9CBB4; }
.tes-grandtotal-bar .tes-gt-value { font-family: 'Cormorant', serif; font-style: italic; font-size: 22px; }

.tes-toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--brand); color: #F7F1E4; padding: 11px 20px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none; z-index: 50;
}
.tes-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.tes-placeholder { padding: 60px 20px; text-align: center; color: var(--ink-muted); }
.tes-placeholder .serif { font-size: 18px; display: block; margin-bottom: 6px; color: var(--ink-soft); }
.tes-placeholder-mark { width: 46px; height: 46px; margin: 0 auto 14px auto; opacity: 0.35; }
.tes-placeholder-mark img { width: 100%; height: 100%; object-fit: contain; }

/* ---------- SHARED: FORMS, LISTS, TIER BADGES, MODAL ---------- */
.tes-form-label { font-size: 11.5px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px; }
.tes-form-input, .tes-form-select {
  width: 100%; padding: 9px 12px; border-radius: 7px; border: 1px solid var(--line);
  font-size: 13.5px; font-family: inherit; background: var(--surface-alt); color: var(--ink);
}
.tes-form-input:focus, .tes-form-select:focus { outline: none; border-color: var(--brand-2); }
.tes-form-row { margin-bottom: 14px; }
.tes-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.tes-tier-badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.tes-tier-badge.super { background: var(--brand); color: #F7F1E4; }
.tes-tier-badge.senior { background: var(--positive-bg); color: var(--positive); }
.tes-tier-badge.junior { background: var(--line-soft); color: var(--ink-soft); }
.tes-tier-badge.inactive { background: var(--danger-bg); color: var(--danger); }

.tes-list-row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.tes-list-row:last-child { border-bottom: none; }
.tes-list-row .tes-list-main { flex: 1; min-width: 0; }
.tes-list-row .tes-list-title { font-weight: 600; color: var(--ink); }
.tes-list-row .tes-list-sub { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }

.tes-protected-note { font-size: 11px; color: var(--ink-muted); font-style: italic; }
.tes-banner { background: var(--surface-alt); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
.tes-banner.warn { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }

.tes-modal-overlay {
  position: fixed; inset: 0; background: rgba(43,28,24,0.55); display: flex;
  align-items: center; justify-content: center; z-index: 60; padding: 24px;
}
.tes-modal-card {
  background: var(--surface); border-radius: 14px; max-width: 560px; width: 100%;
  max-height: 86vh; overflow-y: auto; padding: 28px 30px;
}
.tes-modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.tes-modal-title { font-family: 'Cormorant', serif; font-style: italic; font-size: 21px; color: var(--ink); }
.tes-modal-close { background: none; border: none; color: var(--ink-muted); font-size: 18px; cursor: pointer; line-height: 1; }
.tes-modal-close:hover { color: var(--brand); }

.tes-type-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
.tes-type-card {
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer;
  background: var(--surface-alt);
}
.tes-type-card.active { border-color: var(--brand); background: var(--line-soft); }
.tes-type-card .tes-type-name { font-weight: 600; font-size: 13.5px; color: var(--ink); }
.tes-type-card .tes-type-meta { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }

/* ---------- LOGIN ---------- */
.tes-login-page {
  background: var(--bg); min-height: 100vh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; color: var(--ink);
}
.tes-login-card {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 16px;
  padding: 40px 38px; width: 380px; text-align: center;
  box-shadow: 0 18px 40px -20px rgba(67,48,31,0.25);
}
.tes-login-mark { width: 64px; height: 64px; margin: 0 auto 18px auto; border-radius: 50%; background: var(--brand); display:flex; align-items:center; justify-content:center; overflow: hidden; }
.tes-login-mark img { width: 76%; height: 76%; object-fit: contain; }
.tes-login-title { font-size: 20px; margin-bottom: 4px; }
.tes-login-sub { font-size: 12.5px; color: var(--ink-muted); margin-bottom: 26px; }
.tes-login-input {
  width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line);
  font-size: 13.5px; font-family: inherit; margin-bottom: 14px; background: var(--surface-alt); color: var(--ink);
  text-align: center; letter-spacing: 0.02em;
}
.tes-login-input:focus { outline: none; border-color: var(--brand-2); }
.tes-login-btn { width: 100%; justify-content: center; padding: 11px; font-size: 13.5px; }
.tes-login-foot { margin-top: 16px; font-size: 12px; color: var(--ink-muted); }
.tes-login-foot a { color: var(--brand); font-weight: 600; cursor: pointer; }
.tes-login-back { margin-top: 22px; font-size: 12px; color: var(--ink-muted); cursor: pointer; }
.tes-login-back:hover { color: var(--brand); }

/* ---------- CLIENT DASHBOARD ---------- */
.tes-client-page { background: var(--bg); min-height: 100vh; width: 100%; display: flex; justify-content: center; }
.tes-client-inner { width: 100%; max-width: 620px; padding: 48px 28px 60px 28px; }
.tes-client-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.tes-client-admin-link { font-size: 12px; color: var(--ink-muted); cursor: pointer; }
.tes-client-admin-link:hover { color: var(--brand); }
.tes-client-hero { text-align: center; padding: 26px 0 34px 0; }
.tes-client-mark { width: 68px; height: 68px; margin: 0 auto 18px auto; border-radius: 50%; background: var(--brand); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.tes-client-mark img { width: 76%; height: 76%; object-fit: contain; }
.tes-client-names { font-size: 30px; margin-bottom: 8px; }
.tes-client-date { font-size: 13.5px; color: var(--ink-muted); }
.tes-client-countdown { display: inline-block; margin-top: 16px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 30px; padding: 8px 20px; font-size: 12.5px; color: var(--brand); font-weight: 600; }
.tes-client-section { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; }
.tes-client-section-title { font-size: 12px; text-transform: none; color: var(--ink-muted); font-weight: 600; margin-bottom: 12px; }
.tes-client-fact-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 20px; }
.tes-moodboard-frame { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-alt); padding: 34px; text-align: center; color: var(--ink-muted); font-size: 12.5px; }
.tes-client-milestone { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.tes-client-milestone:last-child { border-bottom: none; }
.tes-client-milestone .tes-dot.done { background: var(--positive); }
.tes-client-fee-value { font-family: 'Cormorant', serif; font-style: italic; font-size: 22px; color: var(--brand); margin-top: 4px; }

/* ---------- PLANNING SCHEDULE ---------- */
.tes-phase { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.tes-phase-head { padding: 15px 20px; background: var(--surface-alt); cursor: pointer; }
.tes-phase-head-top { display: flex; justify-content: space-between; align-items: center; }
.tes-phase-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #F7F1E4; font-size: 11px; font-weight: 700; margin-right: 8px; flex-shrink: 0; }
.tes-phase-name { font-family: 'Cormorant', serif; font-style: italic; font-size: 15.5px; color: var(--ink); display: inline-flex; align-items: center; }
.tes-phase-anchor { font-size: 11px; color: var(--brand-2); font-weight: 600; background: var(--line-soft); padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.tes-phase-focus { font-size: 12px; color: var(--ink-muted); margin-top: 4px; margin-left: 30px; }
.tes-phase-progress-track { height: 5px; background: var(--line-soft); border-radius: 4px; margin-top: 10px; margin-left: 30px; overflow: hidden; }
.tes-phase-progress-fill { height: 100%; background: var(--positive); }
.tes-phase-body { padding: 4px 20px 16px 20px; display: none; }
.tes-phase-body.open { display: block; }
.tes-phase-explanation { font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 14px 30px; line-height: 1.6; }
.tes-phase-task { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px 30px; border-top: 1px solid var(--line-soft); font-size: 13px; }
.tes-task-checkbox { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--taupe); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; cursor: pointer; }
.tes-task-checkbox.done { background: var(--positive); border-color: var(--positive); }
.tes-task-checkbox.inprogress { background: var(--warning-bg); border-color: var(--warning); }
.tes-task-label { flex: 1; }
.tes-task-label.done { color: var(--ink-muted); text-decoration: line-through; }

/* ---------- VENDORS ---------- */
.tes-vendor-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; }
.tes-vendor-top { display: flex; justify-content: space-between; align-items: flex-start; }
.tes-vendor-name { font-family: 'Cormorant', serif; font-style: italic; font-size: 15px; }
.tes-vendor-cat { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.tes-vendor-linked { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
.tes-vendor-contacts { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.tes-contact-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; padding: 4px 0; }
.tes-contact-row.former { color: var(--ink-muted); }
.tes-contact-current-tag { font-size: 10px; font-weight: 700; color: var(--positive); background: var(--positive-bg); padding: 2px 8px; border-radius: 20px; }
.tes-contact-former-tag { font-size: 10px; font-weight: 700; color: var(--ink-muted); background: var(--line-soft); padding: 2px 8px; border-radius: 20px; }
.tes-contact-toggle { font-size: 11.5px; color: var(--brand); font-weight: 600; cursor: pointer; margin-top: 6px; display: inline-block; }
.tes-contact-history { display: none; margin-top: 6px; }
.tes-contact-history.open { display: block; }

/* ---------- PAYMENTS / FUNDS ---------- */
.tes-subtabbar { display: flex; gap: 8px; margin-bottom: 18px; }
.tes-subtab { padding: 8px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
.tes-subtab.active { background: var(--brand); color: #F7F1E4; border-color: var(--brand); }
.tes-fund-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.tes-fund-head { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.tes-fund-payer { font-weight: 600; font-size: 13.5px; }
.tes-fund-date { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.tes-fund-amount { font-family: 'Cormorant', serif; font-style: italic; font-size: 16px; color: var(--brand); }
.tes-fund-body { padding: 0 20px 14px 20px; display: none; }
.tes-fund-body.open { display: block; }
.tes-fund-alloc-row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 12.5px; }

/* ---------- ITINERARY ---------- */
.tes-itin-toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
.tes-itin-row {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px;
  padding: 14px 18px; margin-bottom: 8px; cursor: grab;
}
.tes-itin-row.dragging { opacity: 0.4; }
.tes-itin-drag { color: var(--taupe); font-size: 14px; padding-top: 2px; }
.tes-itin-time { width: 78px; flex-shrink: 0; }
.tes-itin-time-input {
  width: 76px; font-weight: 600; font-size: 13px; color: var(--brand);

  padding: 3px 5px; font-family: inherit;
}
.tes-itin-time-input:hover { border-color: var(--line); }
.tes-itin-time-input:focus { outline: none; border-color: var(--brand-2); background: var(--surface-alt); }
.tes-itin-row.out-of-order .tes-itin-time-input { color: var(--danger); }
.tes-itin-warning { font-size: 10.5px; font-weight: 600; color: var(--danger); background: var(--danger-bg); padding: 3px 9px; border-radius: 20px; margin-top: 6px; display: inline-block; }
.tes-itin-body { flex: 1; }
.tes-itin-activity { font-family: 'Cormorant', serif; font-style: italic; font-size: 15px; }
.tes-itin-location { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.tes-itin-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tes-itin-tag { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--line-soft); color: var(--ink-soft); }
.tes-itin-tag.coordinator { background: #E3E8DC; color: var(--positive); }

/* ---------- DOCUMENTS ---------- */
.tes-doc-group-title { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin: 18px 0 8px 0; }
.tes-doc-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 18px; margin-bottom: 8px; }
.tes-doc-name { font-weight: 600; font-size: 13px; flex: 1; }
.tes-doc-version { font-size: 11.5px; color: var(--ink-muted); }
.tes-doc-versions-toggle { font-size: 11.5px; color: var(--brand); font-weight: 600; cursor: pointer; }
.tes-doc-history { display: none; padding: 0 18px 12px 18px; margin-top: -8px; }
.tes-doc-history.open { display: block; }
.tes-doc-history-row { font-size: 12px; color: var(--ink-muted); padding: 5px 0; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; }
.tes-visible-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-muted); cursor: pointer; }
.tes-switch { width: 32px; height: 18px; border-radius: 10px; background: var(--line); position: relative; transition: background 0.15s ease; }
.tes-switch.on { background: var(--positive); }
.tes-switch-knob { width: 14px; height: 14px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: left 0.15s ease; }
.tes-switch.on .tes-switch-knob { left: 16px; }

/* ---------- NOTES ---------- */
.tes-notes-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.tes-note-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px 18px; margin-bottom: 8px; }
.tes-note-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.tes-note-category { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: var(--line-soft); color: var(--ink-soft); }
.tes-note-meta { font-size: 11px; color: var(--ink-muted); }
.tes-note-content { font-size: 13px; color: var(--ink-soft); line-height: 1.6; }

/* ---------- ACTIVITY LOG ---------- */
.tes-activity-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.tes-activity-row:last-child { border-bottom: none; }
.tes-activity-icon { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-alt); border: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.tes-activity-text b { font-weight: 600; }
.tes-activity-time { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

  // ---------------- LIVE BACKEND CLIENT ----------------
  // This file is still a standalone prototype — it has no build step and no
  // server of its own. When it's eventually dropped into the Next.js app
  // (see the backend scaffold's README) at a path the API routes also live
  // under, every call below resolves against the same origin and talks to
  // the real database. Until then — opened directly as a file, or hosted
  // somewhere without the backend behind it — every call fails fast (no
  // matching route / no network) and the UI falls back to the in-memory
  // demo data it always used, so the prototype keeps working for a client
  // walkthrough either way. `state.live` records which mode is actually in
  // effect so the UI can be honest about it rather than pretending.
  const API_BASE = (typeof window !== 'undefined' && window.TES_API_BASE) || '';

  async function apiCall(path, options){
    try {
      const res = await fetch(API_BASE + path, Object.assign({
        headers: { 'Content-Type': 'application/json' },
      }, options || {}));
      let body = null;
      try { body = await res.json(); } catch (e) { /* no JSON body, fine for some 2xx responses */ }
      if(!res.ok) return { ok: false, status: res.status, error: (body && body.error) || ('Request failed (' + res.status + ')') };
      return { ok: true, status: res.status, data: body };
    } catch (err) {
      // Network/CORS failure — most likely because there's no live backend
      // at this origin yet. Not an error to surface to the person using the
      // prototype, just a signal to keep using demo data.
      return { ok: false, status: 0, error: 'offline' };
    }
  }

  const tesApi = {
    requestCode: (email) => apiCall('/api/auth/request-code', { method: 'POST', body: JSON.stringify({ email }) }),
    verifyCode: (email, code) => apiCall('/api/auth/verify-code', { method: 'POST', body: JSON.stringify({ email, code }) }),
    listEvents: () => apiCall('/api/events', { method: 'GET' }),
    createEvent: (payload) => apiCall('/api/events', { method: 'POST', body: JSON.stringify(payload) }),
    listTeam: () => apiCall('/api/admin/team', { method: 'GET' }),

    listClientEmails: (eventId) => apiCall('/api/admin/client-emails?eventId=' + encodeURIComponent(eventId), { method: 'GET' }),
    addClientEmail: (email, eventId) => apiCall('/api/admin/client-emails', { method: 'POST', body: JSON.stringify({ email, eventId }) }),

  // Maps a real Event row (from GET /api/events) onto the shape this
  // prototype's views already expect, so dashboardView/eventsView/etc. don't
  // need to know whether they're looking at demo or real data.
  function mapApiEvent(e, i){
    const guestsTotal = (e.components || []).reduce((s,c) => s + (c.guestCount || 0), 0);
    return {
      id: e.id, names: e.names, type: (e.eventType && e.eventType.name) || 'Event',
      date: e.components && e.components[0] && e.components[0].date ? new Date(e.components[0].date).toDateString() : 'Date to be confirmed',
      stage: e.stage === 'UPCOMING' ? 'Upcoming' : (e.stage === 'ACTIVE_PLANNING' ? 'Active Planning' : 'Completed'),
      progress: 0, guests: guestsTotal || (e.expectedGuests || '—'), hashtag: e.hashtag || 'None',
      planningFeeOutstanding: 0, fundsReceived: 0, vendorDueSoon: 0, daysToEvent: 0,
      colours: e.colours || 'To be confirmed',

      venuePrimary: e.primaryVenue || 'To be confirmed',
      planningStart: e.planningStartDate ? new Date(e.planningStartDate).toDateString() : '—',
    };
  }

  // Tries the real backend once at startup (after login) and swaps the
  // in-memory demo arrays for real data if it answers. Safe to call more
  // than once — each call just re-syncs.
  async function syncWithBackend(){
    const evRes = await tesApi.listEvents();
    if(evRes.ok && Array.isArray(evRes.data)){
      state.live = true;
      events.length = 0;
      evRes.data.forEach((e,i) => events.push(mapApiEvent(e,i)));
    } else {
      state.live = false;
    }

    if(state.live){
      const teamRes = await tesApi.listTeam();
      if(teamRes.ok && Array.isArray(teamRes.data)){
        teamMembers.length = 0;
        teamRes.data.forEach(m => teamMembers.push({
          id: m.id, name: m.name, email: m.email, tier: m.tier,
          isActive: m.isActive, isProtected: m.isProtected, addedBy: null,
        }));
      }
    }
  }

  function lineItem(item, ci, ii){

    if(item.mode === 'split') badge = `<span class="tes-mode-badge split" data-detail="${key}">${item.allocations.length} vendors</span>`;

    let detail = '';
    if(item.mode === 'competing'){

    }

    return `
      <div class="tes-lineitem">
        <div class="tes-lineitem-row">
          <span class="tes-lineitem-name">${item.name}</span>
          ${badge}

  // ---------------- ITINERARY TAB ----------------
  function parseTimeToMinutes(t){
    const m = t.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if(!m) return null;
    let h = parseInt(m[1],10); const min = parseInt(m[2],10); const ampm = (m[3]||'').toUpperCase();
    if(ampm === 'PM' && h !== 12) h += 12;
    if(ampm === 'AM' && h === 12) h = 0;
    return h*60 + min;
  }

  function itineraryTab(e){
    const times = itinerary.map(it => parseTimeToMinutes(it.time));
    let hasOutOfOrder = false;
    for(let i=1;i<times.length;i++){

    }
    return `
      <div class="tes-itin-toolbar">
        <button class="tes-btn secondary small" data-action="export-full">Export Full Run of Show</button>
        <button class="tes-btn secondary small" data-action="export-coordinator">Export by Coordinator</button>

      <div class="tes-page-sub" style="margin-bottom:4px;">Drag rows to reorder the run of show. Click a time to edit it.</div>

        ${itinerary.map((it, i) => itineraryRow(it, i, times)).join('')}

  // ---------------- HANDLERS ----------------
  function attachHandlers(){
    document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => {
      state.view = el.getAttribute('data-nav'); render();
    }));
    document.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', () => {
      state.filter = el.getAttribute('data-filter'); render();
    }));
    document.querySelectorAll('[data-open-event]').forEach(el => el.addEventListener('click', () => {
      state.activeEvent = el.getAttribute('data-open-event');
      state.view = 'workspace'; state.eventTab = 'overview'; state.component = 'Wedding Reception';
      render();
    }));
    document.querySelectorAll('[data-eventtab]').forEach(el => el.addEventListener('click', () => {
      state.eventTab = el.getAttribute('data-eventtab'); render();
    }));
    document.querySelectorAll('[data-component]').forEach(el => el.addEventListener('click', () => {
      state.component = el.getAttribute('data-component'); render();
    }));
    document.querySelectorAll('[data-cat]').forEach(el => el.addEventListener('click', () => {
      const id = 'cat-body-' + el.getAttribute('data-cat');
      const body = document.getElementById(id);
      const caret = el.querySelector('.tes-caret');
      body.classList.toggle('open');
      caret.classList.toggle('open');
    }));
    document.querySelectorAll('[data-detail]').forEach(el => el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = 'detail-' + el.getAttribute('data-detail');
      document.getElementById(id).classList.toggle('open');
    }));
    document.querySelectorAll('[data-action="create-event"]').forEach(el => el.addEventListener('click', () => {
      state.modal = 'createEvent'; state.createEventType = null; render();
    }));
    document.querySelectorAll('[data-action="close-modal"]').forEach(el => el.addEventListener('click', () => {
      state.modal = null; state.createEventType = null; render();
    }));
    document.querySelectorAll('[data-pick-type]').forEach(el => el.addEventListener('click', () => {
      state.createEventType = el.getAttribute('data-pick-type'); render();
    }));
    document.querySelectorAll('[data-action="back-to-type-picker"]').forEach(el => el.addEventListener('click', () => {
      state.createEventType = null; render();
    }));
    document.querySelectorAll('[data-action="submit-create-event"]').forEach(el => el.addEventListener('click', () => {
      const names = document.getElementById('newEventNames').value.trim();
      if(!names){ toast('Give the event a name first.'); return; }
      const date = document.getElementById('newEventDate').value.trim() || 'Date to be confirmed';
      const guests = document.getElementById('newEventGuests').value.trim() || '—';
      const venue = document.getElementById('newEventVenue').value.trim() || 'Venue to be confirmed';
      const newEvent = {
        id: 'e' + (events.length + 1), names, type: state.createEventType, date,
        stage: 'Upcoming', progress: 0, guests, hashtag: 'None',
        planningFeeOutstanding: 0, fundsReceived: 0, vendorDueSoon: 0, daysToEvent: 365,
        colours: 'To be confirmed', authorisedEmails: [], contact: '—', location: 'Lagos',
        venuePrimary: venue, planningStart: 'Today',
      };
      events.push(newEvent);
      state.modal = null; state.createEventType = null;
      state.activeEvent = newEvent.id; state.view = 'workspace'; state.eventTab = 'overview';
      render();
      toast('Event created. Phases and budget categories clone from the template the moment this is wired to the real backend.');
    }));
    document.querySelectorAll('[data-eventsfilter]').forEach(el => el.addEventListener('click', () => {
      state.eventsFilter = el.getAttribute('data-eventsfilter'); render();
    }));
    document.querySelectorAll('[data-template-toggle]').forEach(el => el.addEventListener('click', () => {
      const name = el.getAttribute('data-template-toggle');
      state.openTemplate = state.openTemplate === name ? null : name;
      render();
    }));
    document.querySelectorAll('[data-action="toggle-add-team"]').forEach(el => el.addEventListener('click', () => {
      state.showAddTeamForm = !state.showAddTeamForm; render();
    }));
    document.querySelectorAll('[data-action="submit-add-team"]').forEach(el => el.addEventListener('click', async () => {
      const name = document.getElementById('newTeamName').value.trim();
      const email = document.getElementById('newTeamEmail').value.trim().toLowerCase();
      const tier = document.getElementById('newTeamTier').value;
      if(!name || !email){ toast('Name and email are both required.'); return; }
      if(teamMembers.some(m => m.email.toLowerCase() === email)){ toast('That email is already on the team.'); return; }

      if(state.live){
        const result = await tesApi.addTeam({ email, name, tier });
        if(!result.ok){ toast(result.error || 'Could not add team member.'); return; }
        teamMembers.push({ id: result.data.id, name: result.data.name, email: result.data.email, tier: result.data.tier, isActive: result.data.isActive, isProtected: false, addedBy: state.currentUser.name });
      } else {
        teamMembers.push({ id: 'a' + (teamMembers.length + 1), name, email, tier, isActive: true, isProtected: false, addedBy: state.currentUser.name });
      }
      state.showAddTeamForm = false; render();
      toast(name + ' added. They sign in the same way — request a code at ' + email + '.');
    }));
    document.querySelectorAll('[data-action="toggle-team-active"]').forEach(el => el.addEventListener('click', async () => {
      const id = el.getAttribute('data-team-id');
      const m = teamMembers.find(x => x.id === id);
      if(!m) return;
      const nextActive = !m.isActive;

      if(state.live){
        const result = await tesApi.patchTeam({ adminUserId: m.id, isActive: nextActive });
        if(!result.ok){ toast(result.error || 'Could not update that team member.'); return; }
      }
      m.isActive = nextActive; render();
      toast(m.name + (m.isActive ? ' reactivated.' : ' deactivated.'));
    }));
    document.querySelectorAll('#teamAccessEventSelect').forEach(el => el.addEventListener('change', () => {
      state.teamAccessEvent = el.value; render();
    }));
    document.querySelectorAll('[data-action="revoke-client-email"]').forEach(el => el.addEventListener('click', async () => {
      const eventId = el.getAttribute('data-event-id');
      const email = el.getAttribute('data-email');
      const e = events.find(ev => ev.id === eventId);
      if(!e) return;

      if(state.live){
        // Real rows don't carry their AuthorisedClientEmail id on the
        // mapped event object (only the email string), so re-fetch this
        // event's authorised list to find the id to delete.
        const listRes = await tesApi.listClientEmails(eventId);
        const row = listRes.ok && Array.isArray(listRes.data) ? listRes.data.find(r => r.email === email) : null;
        if(!row){ toast('Could not find that authorisation to revoke.'); return; }
        const result = await tesApi.revokeClientEmail(row.id);
        if(!result.ok){ toast(result.error || 'Could not revoke access.'); return; }
      }
      e.authorisedEmails = e.authorisedEmails.filter(em => em !== email);
      render();
      toast('Access revoked for ' + email + '.');
    }));
    document.querySelectorAll('[data-action="submit-add-client"]').forEach(el => el.addEventListener('click', async () => {
      const eventId = el.getAttribute('data-event-id');
      const input = document.getElementById('newClientEmail');
      const email = input.value.trim().toLowerCase();
      if(!email){ toast('Enter an email to authorise.'); return; }
      const e = events.find(ev => ev.id === eventId);
      if(!e) return;
      if(e.authorisedEmails.includes(email)){ toast('Already authorised on this event.'); return; }

      if(state.live){
        const result = await tesApi.addClientEmail(email, eventId);
        if(!result.ok){ toast(result.error || 'Could not authorise that email.'); return; }
      }
      e.authorisedEmails.push(email);
      state.teamAccessEvent = eventId;
      render();
      toast(email + ' authorised. They’ll get an OTP code and land on ' + e.names + '’s dashboard.');
    }));
    document.querySelectorAll('[data-action="edit-overview"]').forEach(el => el.addEventListener('click', () => {
      toast('Inline editing on Overview fields, straightforward to wire up once this is a real form.');
    }));
    document.querySelectorAll('[data-select]').forEach(el => el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const [key, oi] = el.getAttribute('data-select').split(':');
      const [ci, ii] = key.split('-').map(Number);
      const item = budget[state.component].categories[ci].items[ii];
      item.options.forEach((o,idx) => { o.status = (idx === Number(oi)) ? 'selected' : 'rejected'; });
      item.amount = item.options[Number(oi)].amount;
      budget[state.component].categories[ci].total = budget[state.component].categories[ci].items.reduce((s,it)=>s+it.amount,0);
      toast('Vendor selected. This line item\u2019s committed amount and totals now update.');
      render();
    }));
    document.querySelectorAll('[data-action="send-code"]').forEach(el => el.addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      if(!email){ toast('Enter an email to continue.'); return; }
      state.loginEmail = email;
      state.loginStep = 'code';
      render();
      // Real backend, when there is one, never confirms or denies whether
      // an email is authorised (see request-code/route.ts) — the response
      // is identical either way, so there's nothing to branch on here.
      const result = await tesApi.requestCode(email);
      toast(result.error === 'offline'
        ? 'Code sent to ' + email + ' (demo, any 6 digits work).'
        : 'If that email is authorised, a code has been sent.');
    }));
    document.querySelectorAll('[data-action="verify-code"]').forEach(el => el.addEventListener('click', async () => {
      const email = (state.loginEmail || '').trim();
      const code = document.getElementById('loginCode').value.trim();
      const result = await tesApi.verifyCode(email, code);

      if(result.ok){
        // Real sign-in succeeded — resolve who we are from the real team
        // list rather than guessing, then pull in real events/team data.
        state.live = true;
        await syncWithBackend();
        const typed = email.toLowerCase();
        const matched = teamMembers.find(m => m.email.toLowerCase() === typed);
        state.currentUser = matched || { name: email, email, tier: 'SENIOR', isActive: true, isProtected: false };
        state.view = 'dashboard';
        state.loginStep = 'email';
        render();
        return;
      }

      if(result.error !== 'offline'){
        // There IS a live backend, and it rejected this code — don't fall
        // through to demo sign-in, that would defeat the point of a real
        // OTP check.
        toast(result.error === 'incorrect_or_expired' ? 'That code is incorrect or has expired.' : (result.error || 'Could not verify that code.'));
        return;
      }

      // No backend reachable at all (expected while this is still a
      // standalone file) — fall back to demo sign-in so the prototype
      // stays usable for a walkthrough.
      const typed = (state.loginEmail || '').trim().toLowerCase();
      const matched = teamMembers.find(m => m.email.toLowerCase() === typed);
      state.currentUser = matched || { name: 'Guest Planner', email: typed || 'planner@theeventsmithng.com', tier: 'SENIOR', isActive: true, isProtected: false };
      state.view = 'dashboard';
      state.loginStep = 'email';
      render();
    }));
    document.querySelectorAll('[data-action="resend-code"]').forEach(el => el.addEventListener('click', () => {
      toast('A new code has been sent.');
    }));
    document.querySelectorAll('[data-action="login-back"]').forEach(el => el.addEventListener('click', () => {
      state.loginStep = 'email'; render();
    }));
    document.querySelectorAll('[data-action="preview-client"]').forEach(el => el.addEventListener('click', () => {
      state.activeEvent = state.activeEvent || events[0].id;
      state.view = 'client'; render();
    }));
    document.querySelectorAll('[data-action="back-to-admin"]').forEach(el => el.addEventListener('click', () => {
      state.view = 'dashboard'; render();
    }));
    document.querySelectorAll('[data-phase]').forEach(el => el.addEventListener('click', () => {
      document.getElementById('phase-body-' + el.getAttribute('data-phase')).classList.toggle('open');
    }));
    document.querySelectorAll('[data-contact-toggle]').forEach(el => el.addEventListener('click', () => {
      document.getElementById('contact-history-' + el.getAttribute('data-contact-toggle')).classList.toggle('open');
    }));
    document.querySelectorAll('[data-fund]').forEach(el => el.addEventListener('click', () => {
      document.getElementById('fund-body-' + el.getAttribute('data-fund')).classList.toggle('open');
    }));
    document.querySelectorAll('[data-paysubtab]').forEach(el => el.addEventListener('click', () => {
      state.paymentsSubtab = el.getAttribute('data-paysubtab'); render();
    }));
    document.querySelectorAll('[data-doc-toggle]').forEach(el => el.addEventListener('click', () => {
      document.getElementById('doc-history-' + el.getAttribute('data-doc-toggle')).classList.toggle('open');
    }));
    document.querySelectorAll('[data-doc-visible]').forEach(el => el.addEventListener('click', () => {
      const key = el.getAttribute('data-doc-visible');
      const [folder, idx] = key.split('-');
      documents[folder][Number(idx)].visible = !documents[folder][Number(idx)].visible;
      render();
    }));
    document.querySelectorAll('[data-action="export-full"]').forEach(el => el.addEventListener('click', () => toast('Full Master Itinerary exported as PDF.')));
    document.querySelectorAll('[data-action="export-coordinator"]').forEach(el => el.addEventListener('click', () => toast('Choose a coordinator to export their run sheet, picker built next pass.')));
    document.querySelectorAll('[data-action="export-vendor"]').forEach(el => el.addEventListener('click', () => toast('Choose a vendor to export their call sheet, picker built next pass.')));
    document.querySelectorAll('[data-action="add-note"]').forEach(el => el.addEventListener('click', () => toast('Add Note form, straightforward once this is wired to real input fields.')));

    // Itinerary time editing
    document.querySelectorAll('[data-time-index]').forEach(input => {
      input.addEventListener('change', () => {
        const i = Number(input.getAttribute('data-time-index'));
        itinerary[i].time = input.value.trim();
        render();
        toast('Time updated.');
      });
      input.addEventListener('click', (ev) => ev.stopPropagation());
    });

    // Itinerary drag-and-drop reordering
    let dragFromIndex = null;
    document.querySelectorAll('[data-itin-index]').forEach(row => {
      row.addEventListener('dragstart', (ev) => {
        if (ev.target.tagName === 'INPUT') { ev.preventDefault(); return; }
        dragFromIndex = Number(row.getAttribute('data-itin-index'));
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', (ev) => ev.preventDefault());
      row.addEventListener('drop', () => {
        const toIndex = Number(row.getAttribute('data-itin-index'));
        if (dragFromIndex === null || dragFromIndex === toIndex) return;
        const [moved] = itinerary.splice(dragFromIndex, 1);
        itinerary.splice(toIndex, 0, moved);
        render();
        toast('Run of show reordered. Check the time warning if times no longer line up.');
      });
    });
  }

  render();
})();
</script>

</body>
</html>
